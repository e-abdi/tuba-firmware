# MCUboot (bootloader image) configuration fragment for sysbuild.
#
# The board overlay in boards/esp32_devkitc_procpu.overlay sets UART0 to
# 9600 baud so the bootloader console matches the application.

# Flash driver: required by MCUboot's flash-map access on ESP32
# (FLASH_MAP is selected by MCUboot but needs a flash driver behind it).
CONFIG_FLASH=y

# The bootloader needs no libc heap; the ESP32 MCUboot linker script does
# not define _heap_sentry, so disable the picolibc malloc arena to avoid
# an undefined-reference link error.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
