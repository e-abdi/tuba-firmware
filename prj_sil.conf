# prj_sil.conf — Tuba firmware as a Linux process (software-in-the-loop)
#
# Build:  ./sil_build.sh        (west build -b native_sim/native/64 -- -DCONF_FILE=prj_sil.conf)
# Run:    ./sil_run.sh          (with Gazebo + tuba-sim/bridge running)
#
# Everything the ESP32 build has except WiFi/OTA/MCUboot; the hardware is
# replaced by Zephyr's emulated GPIO/I2C/ADC, driven from Gazebo through
# src/sil/ (see SIL.md). The menu runs on the terminal that starts the
# executable.

# ===== CONSOLE (terminal stdin/stdout) =====
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_NATIVE_PTY=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
# native_sim's default console is the line-buffered, colourising POSIX trace
# console: menu prompts without a newline ("Select [1-5]: ") would never show.
# Use the UART (unbuffered, raw bytes, works with pexpect) like the ESP32.
CONFIG_POSIX_ARCH_CONSOLE=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# ===== LOGGING / DIAGNOSTICS =====
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SHELL=n
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=8192

# ===== EMULATED HARDWARE =====
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_ADC=y
CONFIG_ADC_EMUL=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ===== PARAMETER PERSISTENCE (NVS on the simulated flash) =====
# Pass --flash=<file> to the executable to keep parameters between runs.
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ===== SIM LINK: host UDP sockets through the native-simulator offload =====
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
