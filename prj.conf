# prj.conf — Tuba glider firmware configuration
#
# Field access:
#   Serial:  screen /dev/ttyUSB0 9600   (or minicom -D /dev/ttyUSB0 -b 9600)
#   WiFi:    join AP "Tuba-Glider", then: telnet 192.168.4.1 23
#
# Power-up behavior:
#   Press ENTER within the startup window (STARTUP_TIMEOUT_SEC in
#   app_limits.h, currently 600 s) to get the menu; otherwise the glider
#   auto-enters DEPLOYED and starts a mission.

# ===== CONSOLE =====
# UART0 console via USB bridge at 9600 baud (set in the board overlay;
# 9600 tolerates long/noisy cable runs into the hull).
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# ===== WIFI ACCESS POINT ("Tuba-Glider") =====
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_AP=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
# DHCPv4 SERVER: hand out IPs to clients that join the AP (required for telnet)
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_ARP=y
# TCP keepalive: lets the telnet server detect a client whose link vanished
# (antenna dipped under water) in ~25 s instead of waiting out TCP's default
# retransmit timeout. Tuned per-socket in src/main.c.
CONFIG_NET_TCP_KEEPALIVE=y
# poll() set for the telnet server: 1 listening socket + NET_CONSOLE_MAX_CLIENTS.
CONFIG_NET_SOCKETS_POLL_MAX=8
CONFIG_HEAP_MEM_POOL_SIZE=65536
# DHCP server + net mgmt callbacks run on the system workqueue; the 1K default
# overflows when a client requests a lease (sysworkq stack overflow). Bump it.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# DHCP server receives/processes leases on the socket-service thread. Zephyr's
# 2400 default (ARM-tuned) overflows on Xtensa/ESP32 -> net_socket_service crash.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096

# WiFi power management - DISABLE to prevent AP mode issues
CONFIG_PM=n

# ===== LOGGING / DIAGNOSTICS =====
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_SHELL=n
CONFIG_ASSERT=y
CONFIG_STDOUT_CONSOLE=y
# Thread/stack diagnostics (names in fault dumps, stack canaries)
CONFIG_THREAD_NAME=y
CONFIG_STACK_SENTINEL=y

# ===== SENSOR BUS =====
CONFIG_I2C=y
CONFIG_I2C_ESP32=y
CONFIG_SENSOR=y
# ADC for the leak detector (GPIO34 = ADC1 CH6)
CONFIG_ADC=y
# MS5837/TSYS01/BMP180/HMC6343/GPS all use custom register-level drivers in
# src/hw_*.c, not Zephyr sensor drivers (finer control over the flaky ESP32
# I2C controller and sensor quirks).

# Float formatting for printk (depth/temperature output)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=3072

# ===== PARAMETER PERSISTENCE (NVS via settings) =====
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_CRC=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ===== OVER-THE-AIR (OTA) UPDATE =====
# Socket-based HTTP download into MCUboot slot1 (see src/ota_simple.c)
CONFIG_HTTP_CLIENT=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
